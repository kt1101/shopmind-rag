# Alembic config for the ShopMind system of record (ADR 0002).
# Run from api/:  alembic upgrade head
# The database URL comes from DATABASE_URL, else the layered app config
# (configs/app.yaml + profiles/$SHOPMIND_PROFILE.yaml -> database.url, default sqlite data/shopmind.db).
# Migrations live inside the package so the Docker image (COPY shopmind) ships them.

[alembic]
script_location = shopmind/infrastructure/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
