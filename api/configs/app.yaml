# Base application config. Layering: this file (+ include files below) -> profiles/$SHOPMIND_PROFILE.yaml
# -> legacy env vars -> SHOPMIND__SECTION__KEY env vars -> runtime admin overrides (database).
# Each include file has one owning subsystem; values in this file win over includes.
include:
  - components/platform.yaml     # database, auth, tracing, features, hot_reloadable
  - components/embedders.yaml    # embedders, indexes (alias + vector field -> embedder)
  - components/prompts.yaml      # prompts, vocabularies
  - pipelines/search.yaml        # search.* pipelines + defaults.search*
  - pipelines/rag.yaml           # rag.* / chat / compare pipelines + defaults.rag*
elasticsearch:
  url: http://localhost:9200
  index_alias: products
embedding:
  provider: siglip2
  model_name: google/siglip2-base-patch16-224
  model_revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
  batch_size: 32
retrieval:
  default_mode: hybrid
  top_k: 10
  candidate_k: 100
fusion:
  method: rrf
  lexical_preserving: true
  rrf_k: 60
reranker:
  enabled: false
api:
  max_image_bytes: 5242880
rag:
  enabled: true
  chat:
    sources: [product, policy]
    include_reviews_when_available: true
