# BM25 + E5 dense, reciprocal rank fusion with equal weights (search.hybrid).
experiment:
  name: hybrid_rrf
  dataset_version: abo_a1_1500_v1
  index_version: products_a1_1500_v2
retrieval:
  mode: hybrid
  top_k: 10
  candidate_k: 100
fusion:
  method: rrf
  rrf_k: 60
embedding:
  model: intfloat/multilingual-e5-base
  version: default
reranker:
  enabled: false
