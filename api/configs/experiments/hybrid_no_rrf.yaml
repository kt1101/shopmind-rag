# Evaluation-only control: BM25-first union of BM25 and dense candidates, no fusion.
experiment:
  name: hybrid_no_rrf
  dataset_version: abo_a1_1500_v1
  index_version: products_a1_1500_v2
retrieval:
  mode: hybrid
  top_k: 10
  candidate_k: 100
fusion:
  method: none
  rrf_k: 60
embedding:
  model: intfloat/multilingual-e5-base
  version: default
reranker:
  enabled: false
