[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopmind"
version = "0.1.0"
description = "Multimodal product retrieval foundation using Elasticsearch and SigLIP2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
  "elasticsearch>=8.15,<9.0",
  "transformers>=4.47,<5.0",
  "torch>=2.2,<3.0",
  "pillow>=10.4,<13.0",
  "numpy>=1.26,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "openai>=3.8,<4.0",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "pyjwt>=2.9,<3",
  "bcrypt>=4.2,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1",
  "pre-commit>=3.7,<5",
]
# Cross-encoder reranker (BAAI/bge-reranker-v2-m3) for A3, and optionally A1.
rag-rerank = ["sentence-transformers>=3,<6"]
# Dedicated multilingual text embedder (E5/BGE) for text<->text dense retrieval.
text-embed = ["sentence-transformers>=3,<6"]
# Offline 2D embedding map: PCA via scikit-learn; UMAP background layout is optional.
viz = ["scikit-learn>=1.5,<2", "umap-learn>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["shopmind*", "evaluation*", "scripts*"]

[tool.setuptools.package-data]
"shopmind.infrastructure.db.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require a real Elasticsearch service",
  "slow: tests that load large models or process non-trivial datasets",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-only: the codebase uses long single-line style, so no formatter/style rules.
select = ["F", "E9"]
